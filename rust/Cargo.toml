[package]
name = "point_glass_opengl_core"
version = "0.3.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
gl = "0.14.0"
libc = "0.2.186"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk = "0.8.0"
khronos-egl = { version = "6.0.0", features = ["dynamic"] }